<!DOCTYPE html>
<html>
<head>
    <title>Blockchain Voting</title>
</head>
<body>
    <h1>Welcome to Blockchain Voting</h1>
    <h2>Available Candidates</h2>
    <ul>
        {% for candidate in candidates %}
            <li>{{ candidate.id }} - {{ candidate.name }} (Votes: {{ candidate.voteCount }})</li>
        {% endfor %}
    </ul>
    <h2>Cast Your Vote</h2>
    <form method="post">
        {% csrf_token %}
        <label for="candidate_id">Candidate ID:</label>
        <input type="number" id="candidate_id" name="candidate_id" required>
        <button type="submit">Vote</button>
    </form>
</body>
</html>
